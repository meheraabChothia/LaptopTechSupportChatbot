<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {  
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif, monospace;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background: rgb(36, 0, 0);
            background: linear-gradient(90deg, rgba(36, 0, 0, 0.7486344879748774) 0%, rgba(121, 9, 104, 0.8410714627647934) 49%, #00c2ff98 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s;
            display: flex;
            height: 90vh;
            margin: 20px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .left-panel {
            width: 30%;
            padding: 20px;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px 0 0 10px;
            height: 100%;
        }

        .right-panel {
            width: 70%;
            padding: 20px;
            background-color: white;
            border-radius: 0 10px 10px 0;
        }

        #chat-display {
            height: 80%;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.95);
            margin-bottom: 20px;
        }

        #user-input {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            align-items: center;
        }

        #user-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        #user-input button {
            padding: 10px 25px;
            margin-left: 10px;
        }

        button {
            background-color: #8f086f;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .conversation-btn {
            display: flex !important;
            flex-direction: column;
            align-items: flex-start;
            padding: 8px 12px;
            height: auto;
            white-space: normal;
            background-color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            border-radius: 25px;
            width: 100%;
            min-height: fit-content;
        }

        .title-text {
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 2px;
            font-size: 14px;
        }

        .date-text {
            font-size: 12px;
            color: #666;
        }

        h4 {
            color: #8f086f;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Update message bubbles to match the theme */
        .user-message {
            background-color: rgba(143, 8, 111, 0.1);
            border-radius: 20px;
            padding: 10px 15px;
            margin: 5px 0 5px auto;
            text-align: right;
            width: fit-content;
            max-width: 70%;
        }

        .bot-message {
            background-color: rgba(0, 194, 255, 0.1);
            border-radius: 20px;
            padding: 10px 15px;
            margin: 5px auto 5px 0;
            text-align: left;
            width: fit-content;
            max-width: 70%;
        }

        /* Scrollbar styling */
        #past-chats::-webkit-scrollbar {
            width: 5px;
        }

        #past-chats::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        #past-chats::-webkit-scrollbar-thumb {
            background: #8f086f;
            border-radius: 5px;
        }

        #past-chats::-webkit-scrollbar-thumb:hover {
            background: #218838;
        }

        #past-chats {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            padding-right: 5px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 8px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .agent-message {
            background-color: rgba(143, 8, 111, 0.2);
            border-radius: 20px;
            padding: 10px 15px;
            margin: 5px auto 5px 0;
            text-align: left;
            width: fit-content;
            max-width: 70%;
            color: #8f086f;
            font-weight: bold;
        }
    </style>
    <script>
        // Initialize socket connection
        const socket = io();
        
        // Add a variable to track if connected to agent
        let connectedToAgent = false;
        
        // Handle socket messages
        socket.on('message', function(msg) {
            const chatDisplay = document.getElementById('chat-display');
            const messageDiv = document.createElement('div');
            // Check for system/connection messages
            if (msg.includes("connected to an agent") || 
                msg.includes("Agent disconnected") || 
                msg.includes("No agent is currently available") || 
                msg.includes("Bot: The agent has ended the conversation")) {
                messageDiv.className = 'bot-message';
                messageDiv.textContent = msg.startsWith("Bot:") ? msg : "Bot: " + msg;
            } else {
                messageDiv.className = msg.startsWith('Agent:') ? 'bot-message' : 'user-message';
                messageDiv.textContent = msg;
            }
            chatDisplay.appendChild(messageDiv);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            
            // Set flag when connected to agent
            if (msg === "You are now connected to an agent. How can they help you today?") {
                connectedToAgent = true;
            } else if (msg === "Agent disconnected. Please try connecting to an agent again later." ||
                       msg === "Bot: The agent has ended the conversation. You can type /agent to connect with another agent, or continue chatting with the bot.") {
                connectedToAgent = false;
            }
        });

        // Add this at the top of the script section, with other global variables
        let solutionCounter = 0;

        // Add this function to handle the agent support prompt
        function showAgentSupportPrompt() {
            const chatDisplay = document.getElementById('chat-display');
            
            // Create prompt message with new styling
            const promptMessage = document.createElement('div');
            promptMessage.className = 'agent-message';
            promptMessage.textContent = "Bot: Would you like to switch to speaking with a human agent for more assistance?";
            chatDisplay.appendChild(promptMessage);
            
            // Create button container with new styling
            const buttonContainer = document.createElement('div');
            buttonContainer.className = 'agent-message';
            buttonContainer.style.display = 'flex';
            buttonContainer.style.gap = '10px';
            
            // Create Yes button
            const yesButton = document.createElement('button');
            yesButton.className = 'btn btn-success';
            yesButton.textContent = 'Yes';
            yesButton.onclick = () => {
                // TODO: Implement agent support switching
                console.log('Switching to agent support...');
            };
            
            // Create No button
            const noButton = document.createElement('button');
            noButton.className = 'btn btn-danger';
            noButton.textContent = 'No';
            noButton.onclick = () => {
                // Remove the prompt and buttons
                promptMessage.remove();
                buttonContainer.remove();
                // Reset counter
                solutionCounter = 0;
            };
            
            buttonContainer.appendChild(yesButton);
            buttonContainer.appendChild(noButton);
            chatDisplay.appendChild(buttonContainer);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        // Modify the sendMessage function to include solution counting
        async function sendMessage() {
            const userInput = document.getElementById('user-input-field');
            const chatDisplay = document.getElementById('chat-display');

            if (userInput.value.trim() !== "") {
                const tempMessage = userInput.value;
                userInput.value = '';

                // Create and display user message immediately
                const userMessage = document.createElement('div');
                userMessage.className = 'user-message';
                userMessage.textContent = "You: " + tempMessage;
                chatDisplay.appendChild(userMessage);
                chatDisplay.scrollTop = chatDisplay.scrollHeight;

                // If connected to agent or requesting agent
                if (connectedToAgent || tempMessage.trim().toLowerCase() === '/agent') {
                    // For /agent command or when connected to agent
                    if (tempMessage.trim().toLowerCase() === '/agent') {
                        socket.emit('message', { username: 'user', message: '/agent' });
                    } else if (connectedToAgent) {
                        socket.emit('message', { username: 'user', message: tempMessage });
                    }
                    return; // Don't send to chatbot if connected to agent
                }

                // Send message to server (only if not connected to agent)
                const response = await fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: tempMessage })
                });

                const data = await response.json();

                // Check for inappropriate content error
                if (response.status === 400 && data.error === 'inappropriate_content') {
                    // Remove the user message
                    userMessage.remove();
                    
                    // Create error message element
                    const errorMessage = document.createElement('div');
                    errorMessage.className = 'bot-message';
                    errorMessage.style.color = '#dc3545'; // Red color for error
                    errorMessage.innerHTML = "System: " + data.message;
                    chatDisplay.appendChild(errorMessage);
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                    return;
                }

                // If content check passed, proceed with bot response
                if (data.model_found) {
                    // Handle model found case
                    const botQuestion = document.createElement('div');
                    botQuestion.className = 'bot-message';
                    botQuestion.textContent = "Bot: " + data.response;
                    chatDisplay.appendChild(botQuestion);
                    
                    const buttonContainer = document.createElement('div');
                    buttonContainer.className = 'bot-message';
                    buttonContainer.style.display = 'flex';
                    buttonContainer.style.gap = '10px';
                    
                    const yesButton = document.createElement('button');
                    yesButton.className = 'btn btn-success';
                    yesButton.textContent = 'Yes';
                    yesButton.onclick = () => handleModelConfirmation(true, data.pdf_path);
                    
                    const noButton = document.createElement('button');
                    noButton.className = 'btn btn-danger';
                    noButton.textContent = 'No';
                    noButton.onclick = () => handleModelConfirmation(false, data.pdf_path);
                    
                    buttonContainer.appendChild(yesButton);
                    buttonContainer.appendChild(noButton);
                    chatDisplay.appendChild(buttonContainer);
                } else {
                    // Check if bot response was inappropriate
                    if (data.error === 'inappropriate_content') {
                        userMessage.remove();
                        const errorMessage = document.createElement('div');
                        errorMessage.className = 'bot-message';
                        errorMessage.style.color = '#dc3545';
                        errorMessage.innerHTML = "System: " + data.message;
                        chatDisplay.appendChild(errorMessage);
                        chatDisplay.scrollTop = chatDisplay.scrollHeight;
                        return;
                    }

                    // Regular bot response
                    const botResponse = document.createElement('div');
                    botResponse.className = 'bot-message';
                    const formattedResponse = data.response
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    botResponse.innerHTML = "Bot: ";
                    chatDisplay.appendChild(botResponse);
                    await typeMessage(botResponse, formattedResponse);

                    // Check for solution keywords and increment counter
                    if (data.response.toLowerCase().includes('solution') || 
                        data.response.toLowerCase().includes('try') || 
                        data.response.toLowerCase().includes('follow these steps')) {
                        solutionCounter++;
                        console.log('Solution counter:', solutionCounter);
                        
                        // Check if we should show the agent support prompt
                        if (solutionCounter === 3) {
                            showAgentSupportPrompt();
                        }
                    }
                }

                // Update sidebar if new conversation was created
                if (data.update_sidebar) {
                    await loadConversations();
                }
            }
        }

        async function handleModelConfirmation(isCorrect, pdfPath) {
            const chatDisplay = document.getElementById('chat-display');
            
            // Remove confirmation buttons and the question bubble
            const lastBotMessage = chatDisplay.lastElementChild.previousElementSibling; // Get the question bubble
            const buttonContainer = chatDisplay.lastElementChild; // Get the button container
            
            // Remove both elements
            lastBotMessage.remove();
            buttonContainer.remove();

            const response = await fetch('/confirm_model', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    is_correct: isCorrect,
                    pdf_path: pdfPath
                })
            });

            const data = await response.json();
            
            const botResponse = document.createElement('div');
            botResponse.className = 'bot-message';
            botResponse.textContent = "Bot: " + data.response;
            chatDisplay.appendChild(botResponse);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        // Add event listener for the Enter key
        document.addEventListener('DOMContentLoaded', (event) => {
            const userInput = document.getElementById('user-input-field');
            userInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    sendMessage();
                    e.preventDefault(); // Prevent form submission if inside a form
                }
            });
            userInput.focus(); // Set focus on the input field when the page loads
        });

        async function confirmModel(isConfirmed) {
            const chatDisplay = document.getElementById('chat-display');
            const confirmationMessage = document.createElement('div');
            confirmationMessage.className = 'bot-message';

            // Remove the initial Yes/No buttons
            const initialButtons = chatDisplay.querySelectorAll('button');
            initialButtons.forEach(button => button.remove());

            if (isConfirmed) {
                confirmationMessage.textContent = "Bot: Great! Please explain what your issue is.";
            } else {
                confirmationMessage.textContent = "Bot: Please select your laptop company:";
                chatDisplay.appendChild(confirmationMessage);

                const response = await fetch('/get_unique_companies');
                const companies = await response.json();

                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'bot-message';
                buttonContainer.style.display = 'flex';
                buttonContainer.style.flexDirection = 'column';
                buttonContainer.style.gap = '5px';
                buttonContainer.style.alignItems = 'flex-start';

                // Add regular company buttons
                companies.forEach(company => {
                    const button = document.createElement('button');
                    button.className = 'btn btn-info w-100';
                    button.style.marginBottom = '5px';
                    button.textContent = company.charAt(0).toUpperCase() + company.slice(1);
                    button.onclick = () => {
                        selectCompany(company);
                        buttonContainer.remove();
                    };
                    buttonContainer.appendChild(button);
                });

                // Add "Other" button
                const otherButton = document.createElement('button');
                otherButton.className = 'btn btn-secondary w-100';
                otherButton.style.marginBottom = '5px';
                otherButton.textContent = 'Other';
                otherButton.onclick = async () => {
                    buttonContainer.remove();
                    
                    // Add user selection message
                    const selectionMessage = document.createElement('div');
                    selectionMessage.className = 'user-message';
                    selectionMessage.textContent = "Selected: Other";
                    chatDisplay.appendChild(selectionMessage);

                    // Toggle mode and get bot response
                    await fetch('/toggle_mode', { method: 'POST' });
                    const response = await fetch('/send_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: "" })
                    });

                    const data = await response.json();
                    const botMessage = document.createElement('div');
                    botMessage.className = 'bot-message';
                    const formattedResponse = data.response
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    botMessage.innerHTML = "Bot: " + formattedResponse;
                    chatDisplay.appendChild(botMessage);
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                };
                buttonContainer.appendChild(otherButton);

                chatDisplay.appendChild(buttonContainer);
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
                return;
            }

            chatDisplay.appendChild(confirmationMessage);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        function selectCompany(company) {
            const chatDisplay = document.getElementById('chat-display');
            
            const selectionMessage = document.createElement('div');
            selectionMessage.className = 'user-message';
            selectionMessage.textContent = "Selected: " + company.charAt(0).toUpperCase() + company.slice(1);
            chatDisplay.appendChild(selectionMessage);

            const botMessage = document.createElement('div');
            botMessage.className = 'bot-message';
            botMessage.textContent = "Bot: Please select your laptop model:";
            chatDisplay.appendChild(botMessage);

            fetch('/get_models_by_company/' + company)
                .then(response => response.json())
                .then(models => {
                    const buttonContainer = document.createElement('div');
                    buttonContainer.className = 'bot-message';
                    buttonContainer.style.display = 'flex';
                    buttonContainer.style.flexDirection = 'column';
                    buttonContainer.style.gap = '5px';
                    buttonContainer.style.alignItems = 'flex-start';

                    // Add regular model buttons
                    models.forEach(model => {
                        const button = document.createElement('button');
                        button.className = 'btn btn-info w-100';
                        button.style.marginBottom = '5px';
                        const formattedModel = model.split(' ')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');
                        button.textContent = formattedModel;
                        button.onclick = () => {
                            selectModel(company, model);
                            buttonContainer.remove();
                        };
                        buttonContainer.appendChild(button);
                    });

                    // Add "Other" button
                    const otherButton = document.createElement('button');
                    otherButton.className = 'btn btn-secondary w-100';
                    otherButton.style.marginBottom = '5px';
                    otherButton.textContent = 'Other';
                    otherButton.onclick = async () => {
                        buttonContainer.remove();
                        
                        // Add user selection message
                        const selectionMessage = document.createElement('div');
                        selectionMessage.className = 'user-message';
                        selectionMessage.textContent = "Selected: Other";
                        chatDisplay.appendChild(selectionMessage);

                        // Toggle mode and get bot response
                        await fetch('/toggle_mode', { method: 'POST' });
                        const response = await fetch('/send_message', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: "" })
                        });

                        const data = await response.json();
                        const botMessage = document.createElement('div');
                        botMessage.className = 'bot-message';
                        const formattedResponse = data.response
                            .replace(/\n/g, '<br>')
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        botMessage.innerHTML = "Bot: " + formattedResponse;
                        chatDisplay.appendChild(botMessage);
                        chatDisplay.scrollTop = chatDisplay.scrollHeight;
                    };
                    buttonContainer.appendChild(otherButton);

                    chatDisplay.appendChild(buttonContainer);
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                });
        }

        function selectModel(company, model) {
            const chatDisplay = document.getElementById('chat-display');
            
            const selectionMessage = document.createElement('div');
            selectionMessage.className = 'user-message';
            const formattedModel = model.split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
            selectionMessage.textContent = "Selected model: " + formattedModel;
            chatDisplay.appendChild(selectionMessage);

            // Send request to update pdf_path
            fetch('/update_pdf_path', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ company: company, model: model })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const botMessage = document.createElement('div');
                    botMessage.className = 'bot-message';
                    botMessage.textContent = "Bot: Great! How can I help you with your " + 
                        company.charAt(0).toUpperCase() + company.slice(1) + " " + formattedModel + "?";
                    chatDisplay.appendChild(botMessage);
                } else {
                    console.error('Failed to update PDF path:', data.message);
                }
            })
            .catch(error => {
                console.error('Error updating PDF path:', error);
            });

            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }

        // Function to send a message to the bot and get the response
        async function sendMessageToBot(userMessage) {
            const response = await fetch('/send_message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: userMessage })
            });

            const data = await response.json();
            const botResponse = document.createElement('div');
            botResponse.className = 'bot-message'; // Apply bot message class
            botResponse.innerHTML = "Bot: " + data.response; // Use the bot's response
            return botResponse; // Return the bot's response element
        }

        async function loadConversations() {
            const pastChatsDiv = document.getElementById('past-chats');
            const response = await fetch('/get_conversations');
            const conversations = await response.json();

            pastChatsDiv.innerHTML = '';
            if (conversations.length === 0) {
                pastChatsDiv.innerHTML = 'No past chats available.';
                return;
            }

            conversations.forEach(conv => {
                const button = document.createElement('button');
                button.className = 'btn btn-light w-100 text-left mb-2 conversation-btn';
                
                // Create containers for title and date
                const titleDiv = document.createElement('div');
                titleDiv.className = 'title-text';
                titleDiv.textContent = conv.title;
                
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-text';
                dateDiv.textContent = `${conv.date} ${conv.time}`;
                
                button.appendChild(titleDiv);
                button.appendChild(dateDiv);
                button.onclick = () => loadConversation(conv.filepath);
                pastChatsDiv.appendChild(button);
            });
        }

        async function loadConversation(filepath) {
            solutionCounter = 0;  // Reset counter
            const chatDisplay = document.getElementById('chat-display');
            const response = await fetch('/load_conversation', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ filepath: filepath })
            });

            const data = await response.json();
            if (data.status === 'success') {
                chatDisplay.innerHTML = '';
                
                // Add loading message without typing effect
                const modelInfo = document.createElement('div');
                modelInfo.className = 'bot-message';
                modelInfo.innerHTML = data.loading_message;
                chatDisplay.appendChild(modelInfo);

                // Add conversation history without typing effect
                for (const msg of data.history) {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = msg.type === 'user' ? 'user-message' : 'bot-message';
                    
                    const formattedContent = msg.content
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    msgDiv.innerHTML = `${msg.type === 'user' ? 'You: ' : 'Bot: '}${formattedContent}`;
                    chatDisplay.appendChild(msgDiv);
                }

                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }
        }

        async function startNewChat() {
            solutionCounter = 0;  // Reset counter
            const chatDisplay = document.getElementById('chat-display');
            chatDisplay.innerHTML = '';
            
            await fetch('/initialize_new_chat', { method: 'POST' });
            location.reload();
        }

        // Load conversations when page loads
        document.addEventListener('DOMContentLoaded', (event) => {
            loadConversations();
            // ... existing DOMContentLoaded code ...
        });

        // Add this new function to handle the typing animation
        async function typeMessage(element, message, speed = 7) {
            const chatDisplay = document.getElementById('chat-display');
            // Initial scroll to bottom
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            
            let currentText = '';
            let tagBuffer = '';
            let isInTag = false;
            
            for (let i = 0; i < message.length; i++) {
                if (message[i] === '<') {
                    isInTag = true;
                    tagBuffer = '<';
                    continue;
                }
                
                if (isInTag) {
                    tagBuffer += message[i];
                    if (message[i] === '>') {
                        isInTag = false;
                        currentText += tagBuffer;
                        element.innerHTML = currentText;
                        tagBuffer = '';
                        // Scroll after adding HTML tag
                        chatDisplay.scrollTop = chatDisplay.scrollHeight;
                    }
                    continue;
                }
                
                currentText += message[i];
                element.innerHTML = currentText;
                
                if (!isInTag) {
                    // Scroll after each character
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                    await new Promise(resolve => setTimeout(resolve, speed));
                }
            }
        }

        async function logout() {
            try {
                await fetch('/logout');
                window.location.href = '/';  // Redirect to login page
            } catch (error) {
                console.error('Error during logout:', error);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h4>Past Chats</h4>
            <div id="past-chats"></div>
            <button class="btn btn-primary mt-3" onclick="startNewChat()">New Chat</button>
        </div>
        <div class="right-panel">
            <div class="header">
                <h4>Chat</h4>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div id="chat-display">
                <div class="bot-message">{{ confirmation_message }}</div>
                <button class="btn btn-success" onclick="confirmModel(true)">Yes</button>
                <button class="btn btn-danger" onclick="confirmModel(false)">No</button>
            </div>
            <div id="user-input">
                <input type="text" id="user-input-field" class="form-control" placeholder="Type your message here...">
                <button class="btn btn-success ml-2" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
